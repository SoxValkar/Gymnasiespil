<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Detective — Matematik</title>
<style>
:root {
  --bg:#090b12; --panel:#121625; --panel2:#191f32; --text:#f4f6fb; --muted:#a7b0c5;
  --accent:#7c9cff; --good:#38d996; --bad:#ff6577; --gold:#ffd166; --line:#2a324c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,#18203a 0,#090b12 46%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.app{width:min(960px,100%);margin:auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#839fff,#5e78e8);box-shadow:0 7px 25px #6f88ff44;color:#081027;font-size:20px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#111625cc;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.25rem} .stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card{background:linear-gradient(180deg,#151a2b,#101421);border:1px solid #2a3452;border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 24px 80px #0008;position:relative;overflow:hidden}
.topic{font-size:.78rem;color:#9db0ff;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.questionline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px}
.questionline h1{font-size:clamp(1.45rem,4vw,2.25rem);margin:.2rem 0 .8rem}
.pointsTag{white-space:nowrap;border:1px solid #3c496d;border-radius:999px;padding:7px 11px;color:var(--gold);font-weight:800;font-size:.85rem}
.clues{display:grid;gap:9px;margin:16px 0 20px}
.clue{display:flex;gap:11px;align-items:flex-start;background:#0d1120;border:1px solid var(--line);border-radius:14px;padding:13px 14px;animation:reveal .28s ease}
.clue.locked{opacity:.24;filter:blur(1.5px);user-select:none}
.cluenum{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#26304d;display:grid;place-items:center;font-weight:900;font-size:.8rem}
@keyframes reveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{background:var(--panel2);color:var(--text);border:1px solid #303a59;border-radius:14px;padding:15px;text-align:left;cursor:pointer;transition:.14s;position:relative;font-weight:750}
.answer:hover:not(:disabled){transform:translateY(-2px);border-color:#6e86df;background:#202844}
.answer .key{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#0c1020;color:#9ca9c9;margin-right:8px;font-size:.78rem}
.answer.correct{border-color:var(--good);background:#14352c}
.answer.wrong{border-color:var(--bad);background:#3b1720}
.answer:disabled{cursor:default}
.actions{display:flex;gap:10px;margin-top:14px}
.primary,.next{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:900;cursor:pointer}
.primary{background:#758fff;color:#081027} .primary:disabled{opacity:.4;cursor:default}
.next{background:var(--good);color:#071b13;display:none}
.feedback{display:none;margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:#0c1020}
.feedback.show{display:block;animation:reveal .25s ease}
.feedback strong{display:block;margin-bottom:4px}
.feedback.good strong{color:var(--good)} .feedback.bad strong{color:var(--bad)}
.footer{text-align:center;color:#707b99;font-size:.72rem;margin:13px 0 0}
.burst{position:absolute;pointer-events:none;font-weight:1000;color:var(--gold);font-size:1.4rem;animation:burst .75s ease forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.25)}}
.pulse{animation:pulse .32s ease} @keyframes pulse{50%{transform:scale(1.01);box-shadow:0 0 0 4px #38d99622,0 24px 80px #0008}}
@media(max-width:640px){.app{padding:10px}.stats{grid-template-columns:repeat(4,1fr);gap:5px}.stat{padding:8px 4px}.stat b{font-size:1rem}.stat span{font-size:.58rem}.answers{grid-template-columns:1fr}.questionline{align-items:flex-start}.brand{font-size:.8rem}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">?</div><div>Concept Detective<br><span style="color:#839fff;font-size:.72em">Matematik</span></div></div>

  <section class="stats">

    <div class="stat"><b id="answered">0</b><span>Besvaret</span></div>
    <div class="stat"><b id="streak">0</b><span>Streak</span></div>

  <section class="card" id="card">
    <div class="topic" id="topic">Emne</div>
    <div class="questionline">
      <h1>Hvilket fagbegreb er jeg?</h1>
      <div class="pointsTag" id="pointsTag">100 point</div>
    </div>

    <div class="clues" id="clues"></div>
    <div class="answers" id="answers"></div>

    <div class="actions">
      <button class="primary" id="clueBtn">Vis næste ledetråd</button>
      <button class="next" id="nextBtn">Næste begreb →</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <div class="footer">Highscore: <span id="highscore">0</span> · 1–4 = svar · Enter/mellemrum = næste ledetråd eller næste begreb</div>
</main>

  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function refillDeck() {
  const last = current ? current.answer : null;
  deck = shuffle(QUESTIONS);
  if(last && deck.length>1 && deck[0].answer===last) [deck[0],deck[1]]=[deck[1],deck[0]];
}
function pointValue() { return [100,60,30][clueCount-1]; }
function updateStats() {
  scoreEl.textContent=score; correctEl.textContent=correct; answeredEl.textContent=answered; streakEl.textContent=streak;
  highscoreEl.textContent=highscore;
}
function renderClues() {
  cluesEl.innerHTML="";
  current.clues.forEach((text,i)=>{
    const d=document.createElement("div");
    d.className="clue"+(i>=clueCount?" locked":"");
    d.innerHTML=`<div class="cluenum">${i+1}</div><div>${i<clueCount?text:"Ledetråd låst"}</div>`;
    cluesEl.appendChild(d);
  });
  pointsTag.textContent=pointValue()+" point";
  clueBtn.disabled = clueCount>=3 || locked;
  clueBtn.textContent = clueCount>=3 ? "Alle ledetråde vist" : "Vis næste ledetråd";
}
function renderAnswers() {
  answersEl.innerHTML="";
  shuffle(current.options).forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.dataset.answer=opt;
    b.innerHTML=`<span class="key">${i+1}</span>${opt}`;
    b.addEventListener("click",()=>choose(opt,b));
    answersEl.appendChild(b);
  });
}
function newQuestion() {
  if(deck.length===0) refillDeck();
  current=deck.shift();
  clueCount=1; locked=false;
  topicEl.textContent=current.topic;
  feedback.className="feedback"; feedback.innerHTML="";
  nextBtn.style.display="none"; clueBtn.style.display="block";
  renderClues(); renderAnswers();
}
function showClue() {
  if(locked || clueCount>=3) return;
  clueCount++;
  renderClues();
}
function burst(points) {
  const el=document.createElement("div");
  el.className="burst"; el.textContent="+"+points;
  el.style.left="50%"; el.style.top="22%";
  card.appendChild(el); setTimeout(()=>el.remove(),800);
}
function choose(opt,button) {
  if(locked) return;
  locked=true; answered++;
  const isCorrect=opt===current.answer;
  [...answersEl.children].forEach(b=>{
    b.disabled=true;
    if(b.dataset.answer===current.answer) b.classList.add("correct");
  });
  if(isCorrect) {
    const base=pointValue();
    const bonus=Math.min(streak,10)*5;
    const earned=base+bonus;
    score+=earned; correct++; streak++;
    button.classList.add("correct");
    feedback.className="feedback show good";
    feedback.innerHTML=`<strong>Korrekt · +${earned} point</strong>${current.explanation}${bonus?` <span style="color:#ffd166">Streak-bonus: +${bonus}</span>`:""}`;
    burst(earned); card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse");
  } else {
    streak=0; button.classList.add("wrong");
    feedback.className="feedback show bad";
    feedback.innerHTML=`<strong>Ikke helt — svaret er ${current.answer}</strong>${current.explanation}`;
  }
  if(score>highscore) {
    highscore=score; localStorage.setItem("conceptDetectiveHighscore",String(highscore));
  }
  updateStats();
  clueBtn.style.display="none"; nextBtn.style.display="block";
}
clueBtn.addEventListener("click",showClue);
nextBtn.addEventListener("click",newQuestion);
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("Vil du nulstille score, streak og highscore?")) {
    score=correct=answered=streak=0; highscore=0;
    localStorage.removeItem("conceptDetectiveHighscore");
    deck=[]; current=null; updateStats(); newQuestion();
  }
});
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if(!locked && /^[1-4]$/.test(e.key)) {
    const b=answersEl.children[Number(e.key)-1]; if(b) b.click();
  }
  if(e.key==="Enter" || e.code==="Space") {
    e.preventDefault();
    if(locked) newQuestion(); else showClue();
  }
});
updateStats();
newQuestion();
</script>
</body>
</html>
